name: Windows release smoke

on:
  push:
    branches: [main, master, thread_chunks]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "src/**"
      - "scripts/build/**"
      - "scripts/doctor-windows.ps1"
      - "resource_packs/**"
      - "tools/**"
      - "content/**"
  pull_request:
    branches: [main, master, thread_chunks]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "src/**"
      - "scripts/build/**"
      - "scripts/doctor-windows.ps1"
      - "resource_packs/**"
      - "tools/**"
      - "content/**"
  workflow_dispatch:
    inputs:
      full_test:
        description: Run all reference seeds with determinism check
        type: boolean
        default: false

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block id assignment check
        shell: pwsh
        run: ./tools/assign_pack_block_ids.ps1 -Check

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Configure (Release, static)
        shell: pwsh
        run: ./scripts/build/windows-configure.ps1 -Config Release

      - name: Build Release
        shell: pwsh
        run: cmake --build build/desktop-msvc --config Release --parallel 4

      - name: Verify static exe dependencies
        shell: pwsh
        run: ./scripts/build/verify-windows-exe.ps1

      - name: Doctor smoke (assets, no GUI)
        shell: pwsh
        run: ./scripts/doctor-windows.ps1

      - name: Style audit
        shell: pwsh
        run: python tools/audit_style.py

      - name: clang-format (changed src files)
        shell: pwsh
        run: python tools/audit_clang_format.py

      - name: C++ unit test (chunk load priority)
        shell: pwsh
        run: ./build/desktop-msvc/Release/chunk_load_priority_test.exe

      - name: Creature unit tests
        shell: pwsh
        run: |
          ./build/desktop-msvc/Release/creature_habitat_policy_test.exe
          ./build/desktop-msvc/Release/creature_body_probe_test.exe
          ./build/desktop-msvc/Release/creature_footprint_test.exe
          ./build/desktop-msvc/Release/creature_step_up_test.exe
          ./build/desktop-msvc/Release/creature_placement_test.exe
          ./build/desktop-msvc/Release/creature_separation_test.exe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Worldgen integration test
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.full_test }}" -eq "true") {
            python tools/integration_test_worldgen.py --exe bin/Cubatarium.exe --cwd bin --radius-chunks 2
          } else {
            python tools/integration_test_worldgen.py --exe bin/Cubatarium.exe --cwd bin --radius-chunks 2 --seeds 42 --skip-determinism
          }

      - name: Creature integration smoke
        shell: pwsh
        run: |
          ./bin/Cubatarium.exe --creature-spawn-smoke
          ./bin/Cubatarium.exe --creature-wander-smoke
          ./bin/Cubatarium.exe --creature-movement-smoke
          ./bin/Cubatarium.exe --creature-step-up-smoke
          ./bin/Cubatarium.exe --creature-stack-smoke

      - name: Creature UV validate (tier A)
        shell: pwsh
        run: python tools/validate_creature_uv.py --tier-a --fail-on-threshold

      - name: Creature preview smoke (tier A)
        shell: pwsh
        run: |
          ./bin/Cubatarium.exe --creature-preview-smoke --tier-a
          python tools/compare_creature_preview.py --tier-a --fail-on-diff

      - name: Upload desktop runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubatarium-windows-bin
          path: |
            bin/Cubatarium.exe
            bin/shaders/**
            bin/resource_packs/**
            bin/prefabs/**
            bin/content/**
          if-no-files-found: error
