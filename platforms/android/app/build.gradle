plugins {
    id 'com.android.application'
}

configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
}

def repoRoot = file("../../..").absolutePath

android {
    namespace 'com.cubatarium'
    compileSdk 35
    ndkVersion "30.0.14904198"

    defaultConfig {
        applicationId "com.cubatarium"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.0.1"
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -frtti -fexceptions"
                arguments "-DANDROID_STL=c++_shared"
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        prefab true
    }

    externalNativeBuild {
        cmake {
            path "${repoRoot}/CMakeLists.txt"
            version "3.22.1"
        }
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += "**/*.so"
        }
    }

    sourceSets {
        main {
            assets.srcDir "src/main/assets"
        }
    }
}

tasks.register("syncAssets", Copy) {
    from("${repoRoot}/textures") { into "textures" }
    from("${repoRoot}/models") { into "models" }
    from("${repoRoot}/prefabs") { into "prefabs" }
    from("${repoRoot}/content") { into "content" }
    from("${repoRoot}/resource_packs") {
        into "resource_packs"
        exclude "minecraft_legacy_16/**"
    }
    from("${repoRoot}/shaders/gles") { into "shaders/gles" }
    from("${repoRoot}/fonts") { into "fonts" }
    from("${repoRoot}/config.json.example") { into "." }
    into("${projectDir}/src/main/assets")
}

preBuild.dependsOn syncAssets

dependencies {
    implementation "androidx.games:games-activity:3.0.5"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.15.0"
}
