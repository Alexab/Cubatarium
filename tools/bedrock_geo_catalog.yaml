    geometry: geometry.cow.v1.8
    geometry_source: cow.geo.json
    animation_profile: quadruped
    texture_url: https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19.2/assets/minecraft/textures/entity/cow/cow.png
