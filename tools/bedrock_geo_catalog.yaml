# Bedrock geo creature catalog — maps Cubatarium species to Bedrock assets.
# geometry_source: filename under models/creatures/_sources/bedrock_geo/
# texture_url: Java entity texture (personal study; same UV layout as Bedrock classic mobs)

version: 1

defaults:
  texture_size: [64, 32]
  texture_stem: diffuse
  geometry_file: geometry.geo.json

species:
