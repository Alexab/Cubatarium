    dig:
      level: 0
      groups: { snappy: 3, oddly_breakable_by_hand: 3 }
  - match: "*flower*"
    dig:
      level: 0
      groups: { snappy: 3, oddly_breakable_by_hand: 3 }
  - match: "*grass*"
    dig:
      level: 0
      groups: { snappy: 3, oddly_breakable_by_hand: 3 }
  - match: "log_*"
    dig:
      level: 0
      groups: { choppy: 2 }
  - match: "planks_*"
    dig:
      level: 0
      groups: { choppy: 2 }
  - match: "*wood*"
    dig:
      level: 0
      groups: { choppy: 2 }
  - match: "*dirt*"
    dig:
      level: 0
      groups: { crumbly: 2, oddly_breakable_by_hand: 2 }
  - match: "*sand*"
    dig:
      level: 0
      groups: { crumbly: 2, oddly_breakable_by_hand: 2 }
  - match: "*gravel*"
    dig:
      level: 0
      groups: { crumbly: 2, oddly_breakable_by_hand: 2 }
  - match: "*clay*"
    dig:
      level: 0
