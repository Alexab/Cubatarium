# Maps rigid creature.json parts to baked texture stems.

default_part_groups:
  quadruped:
    body:
      part_ids: [torso]
      stem: body
    face:
      part_ids: [head]
      stem: face
    leg:
      part_ids: [leg_fl, leg_fr, leg_bl, leg_br]
      stem: leg
  biped:
    body:
      part_ids: [torso]
      stem: body
    face:
      part_ids: [head]
      stem: face
    leg:
      part_ids: [leg_l, leg_r]
      stem: leg
    arm:
      part_ids: [arm_l, arm_r]
      stem: arm
  aerial:
    body:
      part_ids: [torso, wing_l, wing_r]
      stem: body
    face:
      part_ids: [head]
      stem: face
    leg:
      part_ids: [leg_l, leg_r]
      stem: leg

species_archetype:
  sheep: quadruped
  cow: quadruped
  wolf: quadruped
  pig: quadruped
  chicken: aerial
  oerkki: biped
  skeleton: biped
  sand_monster: biped

output_size: 64
icon_size: 32
uv_pad: 0.02
uv_match_margin: 0.15
uv_leg_match_margin: 0.35
