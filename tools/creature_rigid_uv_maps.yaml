# Maps rigid creature.json parts to baked texture stems.

default_part_groups:
  quadruped:
    body:
      part_ids: [torso, head, neck]
      stem: body
    face:
      part_ids: [snout]
      stem: face
    ear:
      part_ids: [ear_l, ear_r]
      stem: ear
    tail:
      part_ids: [tail]
      stem: tail
    leg:
      part_ids: [leg_fl, leg_fr, leg_bl, leg_br, leg_ml, leg_mr]
      stem: leg
  biped:
    body:
      part_ids: [torso]
      stem: body
    face:
      part_ids: [head]
      stem: face
    leg:
      part_ids: [leg_l, leg_r]
      stem: leg
    arm:
      part_ids: [arm_l, arm_r]
      stem: arm
  aerial:
    body:
      part_ids: [torso, neck, comb]
      stem: body
    face:
      part_ids: [head, beak]
      stem: face
    wing:
      part_ids: [wing_l, wing_r]
      stem: wing
    leg:
      part_ids: [leg_l, leg_r]
      stem: leg
  aquatic:
    body:
      part_ids: [torso, tail]
      stem: body
    face:
      part_ids: [head, beak]
      stem: face
    leg:
      part_ids: [fin_l, fin_r, leg_l, leg_r]
      stem: leg
  serpentine:
    body:
      part_ids: [torso, tail]
      stem: body
    face:
      part_ids: [head]
      stem: face

