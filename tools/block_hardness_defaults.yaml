schema_version: 1
# Default `hardness` values for resource pack block JSON (Minecraft-like scale).
#
# Semantics (see docs/TECH_DEBT_BLOCK_BREAK.md, zone B):
#   hardness == 0   -> unbreakable (bedrock, barrier, command block, end portal frame)
#   hardness  > 0   -> bare-hand dig time scales with the value
#   fluids get a deliberately high value so they are not dug like solids
#
# Lookup order used by tools/apply_block_hardness.py:
#   1. `exact` map keyed by block name (file stem)
#   2. `patterns` list, first fnmatch hit wins (order matters)
#   3. `fallback`
fallback: 1.0

exact:
  # --- Unbreakable -----------------------------------------------------------
  barrier: 0
  bedrock: 0
  command_block: 0
  end_portal_frame: 0
  end_portal_frame_eye: 0
  # Editor/UI helper block, never part of the world.
  selection: 0

  # --- Soil, sand, snow ------------------------------------------------------
  clay: 0.6
  dirt: 0.5
  farmland_dry: 0.6
  farmland_wet: 0.6
  grass: 0.6
  gravel: 0.5
  hellsand: 0.5
  mycelium: 0.6
  sand: 0.5
  snow: 0.5
  snow_layer: 0.1

  # --- Stone family ----------------------------------------------------------
  brick: 2
  hellrock: 0.4
  nether_brick: 2
  sandstone: 0.8
  sandstone_carved: 0.8
  sandstone_smooth: 0.8
  stone: 1.5
  stoneMoss: 2
  stone_slab: 2
  stone_slab_top: 2
  stonebrick: 1.5
  stonebricksmooth: 1.5
