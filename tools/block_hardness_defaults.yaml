# Safety net for pack-only names missing from `exact`. First match wins.
patterns:
- match: bedrock*
  hardness: 0
- match: barrier*
  hardness: 0
- match: command_block*
  hardness: 0
- match: end_portal_frame*
  hardness: 0
- match: '*water*'
  hardness: 100
- match: '*lava*'
  hardness: 100
- match: '*obsidian*'
  hardness: 50
- match: '*sapling*'
  hardness: 0.05
- match: '*seedling*'
